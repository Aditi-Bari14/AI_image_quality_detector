version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: iqd_backend
    ports:
      - "5000:5000"
    volumes:
      - backend_data:/app/uploads
      - backend_db:/app/db
    environment:
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: iqd_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
  backend_db: